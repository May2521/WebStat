<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omega Predictor // Live Dashboard</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 170, 0, 0.3);
            --accent-orange: #ffaa00;
            --accent-green: #00ff66;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 10%, rgba(255, 170, 0, 0.05) 0%, transparent 60%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-orange);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            background: rgba(0, 255, 102, 0.1);
            color: var(--accent-green);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 102, 0.3);
            font-family: 'JetBrains Mono', monospace;
        }

        .pulse {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent-orange);
        }

        .stat-title {
            font-size: 13px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 26px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            color: #fff;
        }

        /* Content Sections */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        .section-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            min-height: 400px;
            max-height: 600px;
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-orange);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 10px;
        }

        .list-container {
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 5px;
        }

        .list-container::-webkit-scrollbar {
            width: 5px;
        }

        .list-container::-webkit-scrollbar-thumb {
            background: rgba(255, 170, 0, 0.3);
            border-radius: 5px;
        }

        .item-row {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .item-row:hover {
            border-color: var(--accent-orange);
            background: rgba(255, 170, 0, 0.05);
        }

        .empty-msg {
            color: var(--text-muted);
            text-align: center;
            margin-top: 50px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">
                <h1><i class="fa-solid fa-shield-cat"></i> OMEGA PREDICTOR <span style="font-size: 12px; color: var(--text-muted);">DASHBOARD</span></h1>
            </div>
            <div class="status-badge">
                <div class="pulse"></div>
                <span id="connection-status">CONNECTED</span>
            </div>
        </header>

        <!-- Stats Overview -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title"><i class="fa-solid fa-user"></i> Player</div>
                <div class="stat-value" id="player-name">Loading...</div>
            </div>
            <div class="stat-card">
                <div class="stat-title"><i class="fa-solid fa-wallet"></i> เงินสด (Money)</div>
                <div class="stat-value" id="stat-money">$0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title"><i class="fa-solid fa-bolt"></i> ความเร็ว (Speed)</div>
                <div class="stat-value" id="stat-speed">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title"><i class="fa-solid fa-dna"></i> Scramble</div>
                <div class="stat-value" id="stat-scramble">0</div>
            </div>
        </div>

        <!-- Main Lists -->
        <div class="content-grid">
            <!-- Pets Box -->
            <div class="section-box">
                <div class="section-title">
                    <i class="fa-solid fa-paw"></i> สัตว์ทำเงินในฟาร์ม (<span id="pet-count">0</span>)
                </div>
                <div class="list-container" id="pets-list">
                    <div class="empty-msg">รอข้อมูลจากตัวเกม...</div>
                </div>
            </div>

            <!-- Predictions / Inventory Box -->
            <div class="section-box">
                <div class="section-title">
                    <i class="fa-solid fa-egg"></i> ไอเทม / ไข่ในกระเป๋า (<span id="pred-count">0</span>)
                </div>
                <div class="list-container" id="predictions-list">
                    <div class="empty-msg">รอข้อมูลจากตัวเกม...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript สำหรับดึงข้อมูลจาก Server มารender หน้าจอ -->
    <script>
        async function fetchDashboardData() {
            try {
                // สมมติว่าฝั่ง Backend ของคุณมี Endpoint GET สำหรับดึงข้อมูลล่าสุดที่พุชเข้ามา
                // หรือปรับเปลี่ยน URL ตามโครงสร้าง Server Render ของคุณ
                const response = await fetch('/api/data'); // เปลี่ยนเป็น endpoint ที่ดึง JSON ล่าสุด
                const data = await response.json();

                if (data) {
                    document.getElementById('player-name').innerText = data.player || "Unknown";
                    document.getElementById('stat-money').innerText = data.money || "$0";
                    document.getElementById('stat-speed').innerText = data.speed || 0;
                    document.getElementById('stat-scramble').innerText = data.scramble || 0;

                    // Render Pets
                    const petsContainer = document.getElementById('pets-list');
                    const petsCount = document.getElementById('pet-count');
                    petsContainer.innerHTML = '';
                    if (data.pets && data.pets.length > 0) {
                        petsCount.innerText = data.pets.length;
                        data.pets.forEach(pet => {
                            const div = document.createElement('div');
                            div.className = 'item-row';
                            div.innerHTML = `<span>${pet}</span>`;
                            petsContainer.appendChild(div);
                        });
                    } else {
                        petsCount.innerText = 0;
                        petsContainer.innerHTML = '<div class="empty-msg">ไม่พบข้อมูลสัตว์ในฟาร์ม</div>';
                    }

                    // Render Predictions / Eggs
                    const predContainer = document.getElementById('predictions-list');
                    const predCount = document.getElementById('pred-count');
                    predContainer.innerHTML = '';
                    if (data.predictions && data.predictions.length > 0) {
                        predCount.innerText = data.predictions.length;
                        data.predictions.forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'item-row';
                            div.innerHTML = `<span>${item}</span>`;
                            predContainer.appendChild(div);
                        });
                    } else {
                        predCount.innerText = 0;
                        predContainer.innerHTML = '<div class="empty-msg">ไม่พบข้อมูลไข่หรือไอเทม</div>';
                    }

                    document.getElementById('connection-status').innerText = "LIVE SYNCED";
                }
            } catch (error) {
                document.getElementById('connection-status').innerText = "WAITING DATA...";
            }
        }

        // ดึงข้อมูลอัปเดตทุกๆ 2 วินาที
        setInterval(fetchDashboardData, 2000);
        fetchDashboardData();
    </script>
</body>
</html>
